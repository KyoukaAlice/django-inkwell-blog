<!DOCTYPE html>

<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0aa7e0">
    <title>登录 - 我的博客</title>
    <meta name="description" content="一个基于 Django 的个人博客系统：文章、标签、评论互动与数据统计。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link rel="stylesheet" href="static/css/style.css">
    
    <script>
        // 提前应用主题，避免深色模式下的白色闪屏
        (function () {
            var saved = localStorage.getItem('djangoblog-theme');
            if (!saved) {
                saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>


<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <span class="logo-mark">📝</span>
            <span>我的博客<small>Django 博客系统</small></span>
        </a>

        <button class="icon-btn menu-toggle" title="菜单" aria-label="展开菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

        <nav class="nav">
            <a href="index.html" class="">首页</a>
            <a href="tags.html" class="">标签</a>
            <a href="about.html" class="">关于</a>
            
        </nav>

        <div class="header-actions">
            <form class="search-mini hide-sm" method="get" action="search.html" role="search">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="search" name="keyword" placeholder="搜索文章…" value="" aria-label="搜索">
            </form>

            <button class="icon-btn theme-toggle" title="切换主题" aria-label="切换深色/浅色模式"></button>

            
                <a href="login.html" class="btn btn-ghost btn-sm">登录</a>
                <a href="register.html" class="btn btn-primary btn-sm hide-sm">注册</a>
            
        </div>
    </div>
</header>


<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="mark">📝</div>
            <h1>欢迎回来</h1>
            <p>登录后即可点赞、收藏、评论与写作</p>
        </div>

        

        <form method="post" novalidate>
            <input type="hidden" name="csrfmiddlewaretoken" value="FQTs0ECW3zDpAAo7UEHqOIP8l1lWVlVXhOYx4SCTFiSkfAufTpxTjCyn2JDPcgUW">
            

            <div class="form-group">
                <label class="form-label" for="id_username">用户名</label>
                <input type="text" name="username" id="id_username" class="form-control"
                       placeholder="请输入用户名" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">密码</label>
                <input type="password" name="password" id="id_password" class="form-control"
                       placeholder="请输入密码" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">
                登录
            </button>
        </form>

        <div class="auth-foot">
            还没有账号？<a href="register.html">立即注册 →</a>
        </div>
        <div class="auth-alt">
            <a href="index.html">← 先随便逛逛</a>
        </div>
    </div>
</div>


<footer class="footer">
    <div class="footer-inner">
        <div>
            <strong style="color: var(--text-2);">📝 我的博客</strong>
            <span> · 基于 Django 4.2 构建 · 分享思考与成长</span>
        </div>
        <div class="footer-links">
            <a href="index.html">首页</a>
            <a href="tags.html">标签</a>
            <a href="about.html">关于本站</a>
            
            <span>&copy; 2026 All rights reserved.</span>
        </div>
    </div>
</footer>

<script>window.DJANGO_BLOG = { notifPollUrl: "/notifications/poll/" };</script>
<script src="static/js/main.js"></script>

</body>
</html>
